# =============================================
# Perfil PROD - PostgreSQL
# =============================================

# PostgreSQL DataSource (configurar via variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minijira}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

# H2 Console deshabilitada en prod
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.com.minijira=INFO
logging.level.org.springframework.web=WARN
